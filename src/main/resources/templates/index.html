<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <!-- HEADER -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main>
        <div class="hero">
            <h1>Benvenuto su IntimoStore</h1>
            <p>Il tuo negozio di intimo online</p>
        </div>
        
        <div class="home-links">
            <a th:href="@{/categorie}" class="home-card">
                <h3>📂 Categorie</h3>
                <p>Esplora le nostre categorie</p>
            </a>
            <a th:href="@{/prodotti}" class="home-card">
                <h3>👗 Catalogo</h3>
                <p>Scopri tutti i prodotti</p>
            </a>
            <a th:href="@{/carrello}" class="home-card">
                <h3>🛒 Carrello</h3>
                <p>Vedi il tuo carrello</p>
            </a>
            <a th:href="@{/ordini}" class="home-card" th:if="${utenteCorrente != null}">
                <h3>📦 Ordini</h3>
                <p>I tuoi ordini</p>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
