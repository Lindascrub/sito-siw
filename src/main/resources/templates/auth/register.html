<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Registrati')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--tight">

        <div class="page-head page-head--center">
            <span class="eyebrow">Nuovo account</span>
            <h1>Registrati</h1>
        </div>

        <div class="panel">
            <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

            <form th:action="@{/register}" method="post" class="form-stack">
                <div class="field">
                    <label>Nome</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="field">
                    <label>Cognome</label>
                    <input type="text" name="cognome" class="form-control" required>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="field">
                    <label>Conferma password</label>
                    <input type="password" name="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn-solid w-100">Crea account</button>
            </form>

            <p class="form-note text-center mt-4 mb-0">
                Hai già un account? <a th:href="@{/login}">Accedi</a>
            </p>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
