<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 🔹 USA LA SINTASSI CON ~{} -->
<head th:replace="~{fragments/base :: head(title='Login')}"></head>

<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <!-- 🔹 IL CONTENUTO VA NEL FRAGMENT "content" -->
    <main class="container py-4" th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">🔐 Login</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>
                        <div th:if="${successo}" class="alert alert-success" th:text="${successo}">Successo</div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Email / Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                        </form>

                        <hr>
                        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100">
                            🔴 Continua con Google
                        </a>

                        <p class="mt-3 text-center">
                            Non hai un account? <a th:href="@{/register}">Registrati</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
