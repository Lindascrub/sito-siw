<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Checkout')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <h1>Checkout</h1>

        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <div class="row g-4">
            <!-- Riepilogo ordine -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Riepilogo ordine</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="riga : ${carrello.getRighe()}" class="d-flex justify-content-between border-bottom py-1">
                            <span th:text="${riga.prodotto.nome} + ' x' + ${riga.quantita}">Prodotto x2</span>
                            <span th:text="'€' + ${riga.getSubtotale()}">€39.98</span>
                        </div>
                        <div class="d-flex justify-content-between fw-bold mt-2">
                            <span>Totale:</span>
                            <span th:text="'€' + ${carrello.getTotale()}">€0.00</span>
                        </div>
                    </div>
                </div>
            </div>
	
			<a th:href="@{/prodotti}" class="btn btn-primary">🛍️ Continua lo shopping</a>
			<a th:href="@{/carrello/checkout}" class="btn btn-primary">checkout</a>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
