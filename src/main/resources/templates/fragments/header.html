<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER SEMPLICE -->
    <header th:fragment="header">
        <div class="header-container">
            <div class="logo">
                <a th:href="@{/}">
                    <span class="logo-main">Lunna</span>
                    <span class="logo-sub">Comfortable · Intimate · Timeless</span>
                </a>
            </div>
            
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/categorie}">Categorie</a>
                <a th:href="@{/prodotti}">Catalogo</a>
                <a th:href="@{/carrello}">Carrello</a>
                <a th:href="@{/ordini}">Ordini</a>
                <a th:href="@{/admin}" 
                   th:if="${utenteCorrente != null && utenteCorrente.credenziali.ruolo == 'ADMIN'}"
                   class="admin-link">
                   Admin
                </a>
            </nav>
            
            <div class="auth-buttons">
                <div th:if="${utenteCorrente != null}" class="user-info">
                    <span class="username" th:text="'👋 ' + ${utenteCorrente.nome}"></span>
                    <a th:href="@{/logout-manuale}" class="btn-logout">Logout</a>
                </div>
                <div th:unless="${utenteCorrente != null}" class="auth-links">
                    <a th:href="@{/login}" class="btn-login">Accedi</a>
                    <a th:href="@{/register}" class="btn-register">Registrati</a>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
