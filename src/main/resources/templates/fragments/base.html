<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'IntimiStore'">IntimiStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ============================================ -->
    <!-- 🔹 NAVBAR (NERA, LOGO AL CENTRO) -->
    <!-- ============================================ -->
    <nav class="nav-top" th:fragment="navbar">
        <div class="container">
            <button class="menu-toggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <div class="logo"><a th:href="@{/}">IntimiStore</a></div>
            <div class="nav-icons">
                <a th:href="@{/login}"><i class="fas fa-user"></i></a>
                <a th:href="@{/preferiti}"><i class="fas fa-heart"></i></a>
                <a th:href="@{/carrello}">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" th:text="${carrello != null ? carrello.getNumeroArticoli() : 0}">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- 🔹 MENU CATEGORIE -->
    <!-- ============================================ -->
    <div class="nav-menu" th:fragment="nav-menu">
        <ul>
            <li><a th:href="@{/prodotti}">Tutti</a></li>
            <li><a th:href="@{/prodotti?categoria=Intimo+Donna}">Donna</a></li>
            <li><a th:href="@{/prodotti?categoria=Intimo+Uomo}">Uomo</a></li>
            <li><a th:href="@{/prodotti?categoria=Pigiami}">Pigiami</a></li>
            <li><a th:href="@{/prodotti?categoria=Sport}">Sport</a></li>
            <li><a th:href="@{/prodotti?categoria=Accessori}">Accessori</a></li>
        </ul>
    </div>

    <!-- ============================================ -->
    <!-- 🔹 CONTENUTO -->
    <!-- ============================================ -->
    <main th:fragment="content">
        <!-- Il contenuto specifico viene inserito qui -->
    </main>

    <!-- ============================================ -->
    <!-- 🔹 FOOTER -->
    <!-- ============================================ -->
    <footer class="footer" th:fragment="footer">
        <div class="container">
            <div class="footer-grid">
				<div>
				    <h5>Info</h5>
				    <ul>
				        <li><a th:href="@{/chi-siamo}">Chi siamo</a></li>
				        <li><a th:href="@{/spedizioni}">Spedizioni</a></li>
				        <li><a th:href="@{/resi}">Resi</a></li>
				        <li><a th:href="@{/privacy}">Privacy</a></li>
				    </ul>
				</div>
				<div>
				    <h5>Assistenza</h5>
				    <ul>
				        <li><a th:href="@{/contatti}">Contattaci</a></li>
				        <li><a th:href="@{/faq}">FAQ</a></li>
				        <li><a th:href="@{/ordini}">Traccia ordine</a></li>
				    </ul>
				</div>
				<div>
				    <h5>Segui</h5>
				    <div style="display:flex;gap:14px;font-size:1.3rem;">
				        <a href="#" style="color: var(--white-50);"><i class="fab fa-instagram"></i></a>
				        <a href="#" style="color: var(--white-50);"><i class="fab fa-facebook"></i></a>
				        <a href="#" style="color: var(--white-50);"><i class="fab fa-pinterest"></i></a>
				        <a href="#" style="color: var(--white-50);"><i class="fab fa-tiktok"></i></a>
				    </div>
				</div>
            </div>
            <div class="footer-bottom"><p>&copy; 2025 IntimiStore</p></div>
        </div>
		
		</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
