<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'IntimiStore'">LunnaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ============================================ -->
    <!-- 🔹 NAVBAR (NERA, LOGO AL CENTRO) -->
    <!-- ============================================ -->
    <nav class="nav-top" th:fragment="navbar">
        <div class="container">
            <button class="menu-toggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <div class="logo"><a th:href="@{/}">Lunna Store</a></div>
            <div class="nav-icons">
                <a th:href="@{/login}"><i class="fas fa-user"></i></a>
                <a href="#"><i class="fas fa-heart"></i></a>
                <a th:href="@{/carrello}">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" th:text="${carrello != null ? carrello.getNumeroArticoli() : 0}">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- 🔹 MENU CATEGORIE -->
    <!-- ============================================ -->
    <div class="nav-menu" th:fragment="nav-menu">
        <ul>
            <li><a th:href="@{/prodotti}">Tutti</a></li>
            <li><a th:href="@{/prodotti?categoria=Intimo+Donna}">Donna</a></li>
            <li><a th:href="@{/prodotti?categoria=Intimo+Uomo}">Uomo</a></li>
            <li><a th:href="@{/prodotti?categoria=Pigiami}">Pigiami</a></li>
            <li><a th:href="@{/prodotti?categoria=Sport}">Sport</a></li>
            <li><a th:href="@{/prodotti?categoria=Accessori}">Accessori</a></li>
        </ul>
    </div>

    <!-- ============================================ -->
    <!-- 🔹 CONTENUTO -->
    <!-- ============================================ -->
    <main th:fragment="content">
        <!-- Il contenuto specifico viene inserito qui -->
    </main>

    <!-- ============================================ -->
    <!-- 🔹 FOOTER -->
    <!-- ============================================ -->
	<footer th:fragment="footer">
	  <div>
	    <div class="logo">Lunna Store</div>
	    <p class="tag">Il negozio di intimo che ti fa sentire al sicuro.</p>
	  </div>
	  <div>
	    <h4>Negozio</h4>
	    <ul>
	      <li><a th:href="@{/prodotti}">Collezione</a></li>
	      <li><a th:href="@{/prodotti}">Novità</a></li>
	      <li><a th:href="@{/prodotti}">Saldi</a></li>
	    </ul>
	  </div>
	  <div>
	    <h4>Assistenza</h4>
	    <ul>
	       <li><a href="#">Contattaci</a></li>
				 <li><a href="#">FAQ</a></li>
				 <li><a th:href="@{/ordini/history}">Traccia ordine</a></li>
	    </ul>
	  </div>
	  <div>
	    <h4>Seguici</h4>
	    <div style="display:flex;gap:14px;font-size:1.3rem;">
					    <a href="#" style="color: var(--white-50);"><i class="fab fa-instagram"></i></a>
					    <a href="#" style="color: var(--white-50);"><i class="fab fa-facebook"></i></a>
					    <a href="#" style="color: var(--white-50);"><i class="fab fa-pinterest"></i></a>
					    <a href="#" style="color: var(--white-50);"><i class="fab fa-tiktok"></i></a>
					</div>
	  </div>
	  <div class="bottom">
	    <span>© 2026 Lunna store</span>
	    <span>Privacy — Termini</span>
	  </div>
	</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
