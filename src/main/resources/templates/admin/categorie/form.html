<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Gestione categorie')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Backoffice</span>
            <h1>Gestione categorie</h1>
        </div>

        <div class="form-actions" style="margin-bottom: 32px;">
            <a th:href="@{/categorie/admin/new}" class="btn-solid">Nuova categoria</a>
            <a th:href="@{/admin}" class="btn-line">Dashboard</a>
        </div>

        <div th:if="${categorie != null && !categorie.isEmpty()}" class="panel">
            <div class="table-responsive">
                <table class="table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrizione</th>
                            <th>Prodotti</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categorie}">
                            <td th:text="${cat.id}">1</td>
                            <td th:text="${cat.nome}">Intimo</td>
                            <td th:text="${cat.descrizione}">Abbigliamento intimo</td>
                            <td><span class="category-badge" th:text="${cat.prodotti != null ? cat.prodotti.size() : 0}">5</span></td>
                            <td class="text-end">
                                <a th:href="@{/categorie/admin/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary">Modifica</a>
                                <a th:href="@{/categorie/admin/delete/{id}(id=${cat.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Sei sicuro di voler eliminare questa categoria?')">Elimina</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${categorie == null || categorie.isEmpty()}" class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>Nessuna categoria presente.</p>
            <a th:href="@{/categorie/admin/new}" class="btn-solid">Crea la prima categoria</a>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
