<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Categoria - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>IntimoStore - Nuova Categoria</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/admin}">Dashboard</a>
            <a th:href="@{/admin/categorie}">Categorie</a>
        </nav>
    </header>

    <main>
        <h2>Nuova Categoria</h2>

        <form th:action="@{/admin/categorie}" th:object="${categoria}" method="POST" class="admin-form">
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" th:field="*{nome}" required/>
                <span class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Salva</button>
                <a th:href="@{/admin/categorie}" class="btn-secondary">Annulla</a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
