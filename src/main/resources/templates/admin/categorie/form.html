<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title=${categoria.id == null ? 'Nuova Categoria' : 'Modifica Categoria'})"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${categoria.id == null ? '➕ Nuova Categoria' : '✏️ Modifica Categoria'}">Nuova Categoria</h4>
                    </div>
                    <div class="card-body">
                        
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</li>
                            </ul>
                        </div>

                        <form th:action="${categoria.id == null ? @{/categorie/admin/new} : @{/categorie/admin/edit/{id}(id=${categoria.id})}}" 
                              method="post" 
                              th:object="${categoria}">

                            <!-- NOME -->
                            <div class="mb-3">
                                <label class="form-label">Nome *</label>
                                <input type="text" th:field="*{nome}" class="form-control" required>
                                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger small"></span>
                            </div>

                            <!-- DESCRIZIONE -->
                            <div class="mb-3">
                                <label class="form-label">Descrizione</label>
                                <textarea th:field="*{descrizione}" class="form-control" rows="3"></textarea>
                                <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="text-danger small"></span>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    💾 <span th:text="${categoria.id == null ? 'Crea' : 'Aggiorna'}">Crea</span>
                                </button>
                                <a th:href="@{/categorie/admin}" class="btn btn-secondary">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
