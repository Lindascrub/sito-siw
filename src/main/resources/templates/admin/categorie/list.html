<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Gestione Categorie')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📂 Gestione Categorie</h1>
            <a th:href="@{/categorie/admin/new}" class="btn btn-success">➕ Nuova Categoria</a>
        </div>

        <div th:if="${categorie != null && !categorie.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrizione</th>
                            <th>Prodotti</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categorie}">
                            <td th:text="${cat.id}">1</td>
                            <td th:text="${cat.nome}">Intimo</td>
                            <td th:text="${cat.descrizione}">Abbigliamento intimo</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${cat.prodotti != null ? cat.prodotti.size() : 0}">5</span>
                            </td>
                            <td>
                                <a th:href="@{/categorie/admin/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">✏️</a>
                                <a th:href="@{/categorie/admin/delete/{id}(id=${cat.id})}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Sei sicuro di voler eliminare questa categoria?')">🗑️</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div th:if="${categorie == null || categorie.isEmpty()}">
            <div class="text-center py-5">
                <p class="text-muted">Nessuna categoria presente.</p>
                <a th:href="@{/categorie/admin/new}" class="btn btn-primary">➕ Crea la prima categoria</a>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
