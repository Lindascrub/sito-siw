<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Dettaglio ordine (admin)')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">
                <a th:href="@{/admin/ordini}">&larr; Torna alla lista ordini</a>
            </span>
            <h1>Ordine #<span th:text="${ordine.id}">123</span></h1>
            <p>
                <span class="stato" th:text="${ordine.stato}">CREATO</span>
                <span class="order-card__meta ms-3" th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</span>
            </p>
        </div>

        <div th:if="${successo}" class="alert alert-success" th:text="${successo}">Fatto</div>
        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <div class="split">

            <div class="panel">
                <h2 class="panel__head">Articoli</h2>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>Prodotto</th>
                                <th>Taglia</th>
                                <th>Colore</th>
                                <th>Qtà</th>
                                <th class="text-end">Subtotale</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="riga : ${ordine.righe}">
                                <td th:text="${riga.prodotto.nome}">Prodotto</td>
                                <td th:text="${riga.taglia}">M</td>
                                <td th:text="${riga.colore}">Nero</td>
                                <td th:text="${riga.quantita}">1</td>
                                <td class="text-end" th:text="'€' + ${riga.getSubtotale()}">€0,00</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4" class="text-end">Totale</td>
                                <td class="text-end" th:text="'€' + ${ordine.totale}">€0,00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="panel">
                <h2 class="panel__head">Cliente e spedizione</h2>
                <p class="mb-1" th:text="${ordine.utente != null ? ordine.utente.email : 'N/A'}">cliente@email.it</p>
                <p class="mb-1" th:text="${ordine.indirizzoSpedizione}">Via Roma, 123</p>
                <p class="mb-0" th:text="${ordine.cittaSpedizione} + ' — ' + ${ordine.codPostaleSpedizione}">Roma — 00100</p>

                <h2 class="panel__head" style="margin-top:24px;">Pagamento</h2>
                <p th:if="${ordine.dataPagamento}"
                   th:text="${#temporals.format(ordine.dataPagamento, 'dd/MM/yyyy HH:mm')} + ' — ' + ${ordine.metodoPagamento}">-</p>
                <p th:unless="${ordine.dataPagamento}">Non ancora pagato.</p>
            </div>

        </div>

        <div class="panel" style="margin-top:24px;">
            <h2 class="panel__head">Gestione stato</h2>
            <form th:action="@{/admin/ordini/{id}/stato(id=${ordine.id})}" method="post" class="form-actions">
                <select name="stato" class="form-control" style="max-width: 220px;">
                    <option th:each="s : ${stati}" th:value="${s}" th:text="${s}"
                            th:selected="${s == ordine.stato}">CREATO</option>
                </select>
                <button type="submit" class="btn-solid">Aggiorna stato</button>
            </form>

            <form th:if="${ordine.stato.name() != 'ANNULLATO' && ordine.stato.name() != 'CONSEGNATO'}"
                  th:action="@{/admin/ordini/{id}/annulla(id=${ordine.id})}" method="post"
                  class="form-actions" style="margin-top:12px;"
                  onsubmit="return confirm('Confermi di voler annullare questo ordine? Lo stock verrà ripristinato.')">
                <button type="submit" class="btn-line">Annulla ordine</button>
            </form>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
