
       <h3 class="mt-5">Ordini in attesa</h3>
       <div th:if="${ordiniRecent != null && !ordiniRecent.isEmpty()}">
           <div class="table-responsive">
               <table class="table table-striped">
                   <thead>
                       <tr>
                           <th>ID</th>
                           <th>Utente</th>
                           <th>Data</th>
                           <th>Totale</th>
                           <th>Stato</th>
                           <th>Azioni</th>
                       </tr>
                   </thead>
                   <tbody>
                       <tr th:each="ordine : ${ordiniRecent}">
                           <td th:text="${ordine.id}">1</td>
                           <td th:text="${ordine.utente != null ? ordine.utente.email : 'N/A'}">email@test.com</td>
                           <td th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                           <td th:text="'€' + ${ordine.totale}">€0.00</td>
                           <td><span class="badge bg-warning" th:text="${ordine.stato}">CREATO</span></td>
                           <td>
                               <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn btn-sm btn-outline-primary">📄</a>
                           </td>
                       </tr>
                   </tbody>
               </table>
           </div>
       </div>
       <p th:if="${ordiniRecent == null || ordiniRecent.isEmpty()}" class="text-muted">
           Nessun ordine in attesa.
       </p>
