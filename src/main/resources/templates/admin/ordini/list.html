<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Gestione ordini')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Backoffice</span>
            <h1>Gestione ordini</h1>
        </div>

        <div th:if="${successo}" class="alert alert-success" th:text="${successo}">Fatto</div>
        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <form th:action="@{/admin/ordini}" method="get" class="form-actions" style="margin-bottom: 24px;">
            <select name="stato" class="form-control" onchange="this.form.submit()" style="max-width: 220px;">
                <option value="" th:selected="${statoSelezionato == null}">Tutti gli stati</option>
                <option th:each="s : ${stati}" th:value="${s}" th:text="${s}"
                        th:selected="${s == statoSelezionato}">CREATO</option>
            </select>
            <a th:href="@{/admin}" class="btn-line">Dashboard</a>
        </form>

        <div th:if="${ordini != null && !ordini.isEmpty()}" class="panel">
            <div class="table-responsive">
                <table class="table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Utente</th>
                            <th>Data</th>
                            <th>Totale</th>
                            <th>Stato</th>
                            <th>Pagamento</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ordine : ${ordini}">
                            <td th:text="${ordine.id}">1</td>
                            <td th:text="${ordine.utente != null ? ordine.utente.email : 'N/A'}">email@test.com</td>
                            <td th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                            <td th:text="'€' + ${ordine.totale}">€0,00</td>
                            <td><span class="stato" th:text="${ordine.stato}">CREATO</span></td>
                            <td>
                                <span th:if="${ordine.dataPagamento}"
                                      th:text="${#temporals.format(ordine.dataPagamento, 'dd/MM/yyyy HH:mm')} + ' — ' + ${ordine.metodoPagamento}">-</span>
                                <span th:unless="${ordine.dataPagamento}">-</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/admin/ordini/{id}(id=${ordine.id})}" class="btn btn-sm btn-outline-primary">Dettaglio</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <p th:if="${ordini == null || ordini.isEmpty()}" class="form-note">
            Nessun ordine trovato.
        </p>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
