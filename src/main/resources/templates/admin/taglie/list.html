<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Taglie - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <!-- HEADER IMPORTATO -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- CONTENUTO -->
    <main>
        <div class="admin-header">
            <h2>Taglie</h2>
            <a th:href="@{/admin/taglie/nuovo}" class="btn-primary">+ Nuova Taglia</a>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Codice</th>
                    <th>Descrizione</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${taglie}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.codice}">XS</td>
                    <td th:text="${t.descrizione}">Extra Small</td>
                    <td>
                        <a th:href="@{/admin/taglie/elimina/} + ${t.id}" 
                           class="btn-delete"
                           onclick="return confirm('Sei sicuro?')">🗑️</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
