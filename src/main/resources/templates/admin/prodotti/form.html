<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Prodotto - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>IntimoStore - Gestione Prodotti</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/admin}">Dashboard</a>
            <a th:href="@{/admin/prodotti}">Prodotti</a>
        </nav>
    </header>

    <main>
        <h2 th:if="${prodotto.id == null}">Nuovo Prodotto</h2>
        <h2 th:if="${prodotto.id != null}">Modifica Prodotto</h2>

        <form th:action="@{/admin/prodotti}" th:object="${prodotto}" method="POST" class="admin-form">
            
            <!-- Hidden field per l'ID (solo in modifica) -->
            <input type="hidden" th:field="*{id}" th:if="${prodotto.id != null}"/>

            <div class="form-group">
                <label>Nome *</label>
                <input type="text" th:field="*{nome}" required/>
                <span class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-group">
                <label>Descrizione</label>
                <textarea th:field="*{descrizione}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Prezzo *</label>
                <input type="number" step="0.01" th:field="*{prezzo}" required min="1"/>
                <span class="error" th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}"></span>
            </div>

            <div class="form-group">
                <label>Quantità Disponibile *</label>
                <input type="number" th:field="*{quantitaDisponibile}" required min="0"/>
                <span class="error" th:if="${#fields.hasErrors('quantitaDisponibile')}" th:errors="*{quantitaDisponibile}"></span>
            </div>

            <div class="form-group">
                <label>URL Immagine</label>
                <input type="text" th:field="*{urlImmagine}" placeholder="/images/nome.jpg"/>
            </div>

            <div class="form-group">
                <label>Categoria *</label>
                <select th:field="*{categoria.id}" required>
                    <option value="">Seleziona una categoria</option>
                    <option th:each="c : ${categorie}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
            </div>

            <div class="form-group">
                <label>Taglie</label>
                <select name="taglieIds" multiple class="multi-select">
                    <option th:each="t : ${taglie}" th:value="${t.id}" th:text="${t.codice + ' - ' + t.descrizione}"></option>
                </select>
                <small>Tieni premuto Ctrl (o Cmd) per selezionare più taglie</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Salva</button>
                <a th:href="@{/admin/prodotti}" class="btn-secondary">Annulla</a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
