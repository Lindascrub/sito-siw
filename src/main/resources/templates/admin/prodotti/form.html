<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title=${prodotto.id == null ? 'Nuovo prodotto' : 'Modifica prodotto'})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--narrow">

        <div class="page-head">
            <span class="eyebrow">Backoffice</span>
            <h1 th:text="${prodotto.id == null ? 'Nuovo prodotto' : 'Modifica prodotto'}">Nuovo prodotto</h1>
        </div>

        <div class="panel">
            <form th:action="${prodotto.id == null} ? @{/prodotti/admin/new} : @{/prodotti/admin/edit/{id}(id=${prodotto.id})}"
                  method="post"
                  th:object="${prodotto}"
                  class="form-stack">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</li>
                    </ul>
                </div>

                <div class="field">
                    <label>Nome *</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="form-error"></span>
                </div>

                <div class="field">
                    <label>Descrizione</label>
                    <textarea th:field="*{descrizione}" class="form-control" rows="4"></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="form-error"></span>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label>Prezzo (€) *</label>
                        <input type="number" th:field="*{prezzo}" class="form-control" step="0.01" min="0" required>
                        <span th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}" class="form-error"></span>
                    </div>
                    <div class="field">
                        <label>Quantità disponibile *</label>
                        <input type="number" th:field="*{quantitaDisponibile}" class="form-control" min="0" required>
                        <span th:if="${#fields.hasErrors('quantitaDisponibile')}" th:errors="*{quantitaDisponibile}" class="form-error"></span>
                    </div>
                </div>

                <div class="field">
                    <label>URL immagine</label>
                    <input type="url" th:field="*{urlImage}" class="form-control" placeholder="https://esempio.com/immagine.jpg">
                    <span th:if="${#fields.hasErrors('urlImage')}" th:errors="*{urlImage}" class="form-error"></span>
                </div>

                <div class="field">
                    <label>Codice modello</label>
                    <input type="text" th:field="*{codiceModello}" class="form-control" placeholder="INT-001">
                    <span th:if="${#fields.hasErrors('codiceModello')}" th:errors="*{codiceModello}" class="form-error"></span>
                </div>

                <div class="field">
                    <label>Categoria *</label>
                    <select th:field="*{categoria}" class="form-select" required>
                        <option value="">Seleziona una categoria</option>
                        <option th:each="cat : ${categorie}"
                                th:value="${cat}"
                                th:text="${cat.nome}"
                                th:selected="${prodotto.categoria != null && prodotto.categoria.id == cat.id}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" class="form-error"></span>
                </div>

                <div class="field">
                    <label>Taglie disponibili</label>
                    <select th:field="*{taglieDisponibili}" class="form-select" multiple>
                        <option th:each="taglia : ${taglie}"
                                th:value="${taglia.nome}"
                                th:text="${taglia.nome} + ' (' + ${taglia.descrizione} + ')'"></option>
                    </select>
                    <span class="form-note">Tieni premuto Ctrl/Cmd per selezionare più taglie</span>
                </div>

                <div class="field">
                    <label>Colori disponibili</label>
                    <input type="text" th:field="*{coloriDisponibili}" class="form-control"
                           placeholder="Nero, Blu, Rosso">
                    <span class="form-note">Separa i colori con una virgola</span>
                </div>

                <div class="form-check">
                    <input type="checkbox" th:field="*{attivo}" class="form-check-input" id="attivo">
                    <label class="form-check-label" for="attivo">Prodotto attivo</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-solid">
                        <span th:text="${prodotto.id == null ? 'Crea' : 'Aggiorna'}">Crea</span>
                    </button>
                    <a th:href="@{/prodotti}" class="btn-line">Annulla</a>
                </div>
            </form>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
