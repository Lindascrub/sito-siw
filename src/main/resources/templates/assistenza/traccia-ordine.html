<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Traccia ordine')}"></head>
<body>
    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--tight">
        <div class="page-head page-head--center">
            <span class="eyebrow">Assistenza clienti</span>
            <h1>Traccia il tuo ordine</h1>
        </div>

        <div class="panel">
            <form th:action="@{/assistenza-clienti/traccia-ordine}" method="post" class="form-stack">
                <div class="field">
                    <label>Codice ordine *</label>
                    <input type="text" name="codice" class="form-control" required placeholder="es. ORD-12345">
                </div>
                <div class="field">
                    <label>Cognome *</label>
                    <input type="text" name="cognome" class="form-control" required>
                </div>
				<div>
				          <a th:href="@{/da-implementare}" class="btn-solid">Cerca</a>
				      </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
