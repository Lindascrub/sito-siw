<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Ordine confermato')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-5" th:fragment="content">
        <div class="text-center mb-4">
            <h1>✅ Ordine confermato!</h1>
            <p class="text-muted">Grazie per il tuo acquisto, il tuo ordine è stato registrato.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Ordine #<span th:text="${ordine.id}">123</span></h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Stato:</strong> <span th:text="${ordine.stato}">CREATO</span></p>
                        <p><strong>Totale:</strong> <span th:text="'€' + ${ordine.totale}">€0.00</span></p>
                        <hr>
                        <p class="mb-1"><strong>Spedizione a:</strong></p>
                        <p class="mb-0" th:text="${ordine.indirizzoSpedizione}">Via Roma, 123</p>
                        <p th:text="${ordine.cittaSpedizione} + ' - ' + ${ordine.codPostaleSpedizione}">Roma - 00100</p>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4 justify-content-center">
                    <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn btn-outline-primary">📄 Vedi dettaglio ordine</a>
                    <a th:href="@{/prodotti}" class="btn btn-primary">🛍️ Continua lo shopping</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
