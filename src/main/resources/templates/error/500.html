<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Errore del server')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <main class="error-page">
        <div class="code">500</div>
        <h1>Errore del server</h1>
        <p th:text="${errorMessage} ?: 'Si è verificato un errore interno. Riprova più tardi.'">
            Si è verificato un errore interno. Riprova più tardi.
        </p>
        <a th:href="@{/}" class="btn-solid">Torna alla home</a>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
