<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Pagina non trovata')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="text-center py-5">
            <div class="display-1 text-muted">404</div>
            <h1 class="display-6">😕 Pagina non trovata</h1>
            <p class="text-muted" th:text="${errorMessage} ?: 'La pagina che stai cercando non esiste o è stata spostata.'">
                La pagina che stai cercando non esiste o è stata spostata.
            </p>
            <a th:href="@{/}" class="btn btn-primary">🏠 Torna alla home</a>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
