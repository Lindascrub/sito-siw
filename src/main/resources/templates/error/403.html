<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Accesso negato')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <main class="error-page">
        <div class="code">403</div>
        <h1>Accesso negato</h1>
        <p th:text="${errorMessage} ?: 'Non hai i permessi necessari per visualizzare questa pagina.'">
            Non hai i permessi necessari per visualizzare questa pagina.
        </p>
        <div class="form-actions" style="justify-content: center;">
            <a th:href="@{/login}" class="btn-solid">Accedi</a>
            <a th:href="@{/}" class="btn-line">Torna alla home</a>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
