<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Catalogo')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-store"></i> Catalogo Prodotti</h1>
            <a th:href="@{/prodotti/admin/new}" class="btn btn-primary" sec:authorize="hasAuthority('ADMIN')">
                <i class="fas fa-plus"></i> Nuovo prodotto
            </a>
        </div>

        <!-- Ricerca -->
        <div class="card p-3 mb-4 shadow-sm">
            <form th:action="@{/prodotti}" method="get" class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
                        <input type="text" name="search" class="form-control" placeholder="Cerca prodotto..." th:value="${searchTerm}">
                    </div>
                </div>
                <div class="col-md-4">
                    <select name="categoria" class="form-select">
                        <option value="">📂 Tutte le categorie</option>
                        <option th:each="cat : ${categorie}"
                                th:value="${cat.nome}"
                                th:text="${cat.nome}"
                                th:selected="${categoriaSelezionata == cat.nome}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i> Cerca</button>
                </div>
            </form>
        </div>

        <!-- Lista prodotti -->
        <div th:if="${prodotti != null && !prodotti.isEmpty()}">
            <div class="product-grid">
                <div class="product-card" th:each="prodotto : ${prodotti}">
                    <img th:src="${prodotto.urlImage != null ? prodotto.urlImage : '/images/placeholder.jpg'}"
                         th:alt="${prodotto.nome}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${prodotto.nome}">Nome</h5>
                        <span class="price" th:text="'€' + ${prodotto.prezzo}">€19.99</span>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="category-badge" th:text="${prodotto.categoria != null ? prodotto.categoria.nome : 'Generico'}">Categoria</span>
                            <div class="d-flex gap-1">
                                <a th:href="@{/prodotti/{id}(id=${prodotto.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <form th:action="@{/carrello/add/{id}(id=${prodotto.id})}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                                    <input type="hidden" name="quantita" value="1">
                                    <button type="submit" class="btn-add-cart">
                                        <i class="fas fa-shopping-cart"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${prodotti == null || prodotti.isEmpty()}">
            <div class="text-center py-5">
                <i class="fas fa-box-open text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-3">Nessun prodotto trovato.</p>
                <a th:href="@{/prodotti}" class="btn btn-outline-primary"><i class="fas fa-undo"></i> Mostra tutti</a>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
