<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Catalogo')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>🛍️ Catalogo Prodotti</h1>
            <a th:href="@{/prodotti/admin/new}" class="btn btn-success" sec:authorize="hasAuthority('ADMIN')">
                ➕ Nuovo prodotto
            </a>
        </div>

        <!-- Barra di ricerca e filtri -->
        <div class="card p-3 mb-4">
            <form th:action="@{/prodotti}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="search" class="form-control" placeholder="🔍 Cerca prodotto..."
                           th:value="${searchTerm}">
                </div>
                <div class="col-md-4">
                    <select name="categoria" class="form-select">
                        <option value="">📂 Tutte le categorie</option>
                        <option th:each="cat : ${categorie}"
                                th:value="${cat.nome}"
                                th:text="${cat.nome}"
                                th:selected="${categoriaSelezionata == cat.nome}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">🔍 Cerca</button>
                </div>
            </form>
        </div>

        <!-- Lista prodotti -->
        <div th:if="${prodotti != null && !prodotti.isEmpty()}">
            <div class="row g-4">
                <div class="col-md-3" th:each="prodotto : ${prodotti}">
                    <div class="card h-100 product-card">
                        <img th:src="${prodotto.urlImage != null ? prodotto.urlImage : '/images/placeholder.jpg'}"
                             class="card-img-top" th:alt="${prodotto.nome}" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h6 class="card-title" th:text="${prodotto.nome}">Nome</h6>
                            <p class="card-text text-primary fw-bold" th:text="'€' + ${prodotto.prezzo}">€19.99</p>
                            <span class="badge bg-secondary" th:text="${prodotto.categoria != null ? prodotto.categoria.nome : 'Senza categoria'}">Categoria</span>
                            <div class="mt-2 d-flex gap-2">
                                <a th:href="@{/prodotti/{id}(id=${prodotto.id})}" class="btn btn-outline-primary btn-sm flex-grow-1">Dettaglio</a>
                                <form th:action="@{/carrello/add/{id}(id=${prodotto.id})}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                                    <input type="hidden" name="quantita" value="1">
                                    <button type="submit" class="btn btn-primary btn-sm">🛒</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${prodotti == null || prodotti.isEmpty()}">
            <div class="text-center py-5">
                <p class="text-muted">Nessun prodotto trovato.</p>
                <a th:href="@{/prodotti}" class="btn btn-outline-primary">Mostra tutti i prodotti</a>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
