<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(title='Collezione')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Collezione &middot; Tutti i capi</span>
            <h1>Il catalogo</h1>
            <p>Poche referenze, tagli precisi, tessuti naturali. Filtra per categoria o cerca il capo che stai immaginando.</p>
        </div>

        <!-- Filtri -->
        <form th:action="@{/prodotti}" method="get" class="filter-bar">
            <div class="field">
                <label class="form-label">Cerca</label>
                <input type="text" name="search" class="form-control" placeholder="Bralette, slip, seta..." th:value="${searchTerm}">
            </div>
            <div class="field">
                <label class="form-label">Categoria</label>
                <select name="categoria" class="form-select">
                    <option value="">Tutte le categorie</option>
                    <option th:each="cat : ${categorie}"
                            th:value="${cat.nome}"
                            th:text="${cat.nome}"
                            th:selected="${categoriaSelezionata == cat.nome}"></option>
                </select>
            </div>
            <button type="submit" class="btn-solid">Filtra</button>
        </form>

        <!-- Griglia prodotti -->
        <div th:if="${prodotti != null && !prodotti.isEmpty()}" class="product-grid">
            <article class="product-card" th:each="prodotto : ${prodotti}">
                <a th:href="@{/prodotti/{id}(id=${prodotto.id})}">
                    <img th:src="${prodotto.urlImage != null ? prodotto.urlImage : '/images/placeholder.jpg'}"
                         th:alt="${prodotto.nome}">
                </a>
                <div class="card-body">
                    <h5 class="card-title"><a th:href="@{/prodotti/{id}(id=${prodotto.id})}" th:text="${prodotto.nome}">Nome</a></h5>
                    <span class="price" th:text="'€' + ${prodotto.prezzo}">€19,99</span>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="category-badge" th:text="${prodotto.categoria != null ? prodotto.categoria.nome : 'Generico'}">Categoria</span>
                        <div class="d-flex gap-2">
                            <form th:action="@{/preferiti/toggle/{id}(id=${prodotto.id})}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                                <input type="hidden" name="redirect" th:value="@{/prodotti}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Preferiti">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </form>
                            <form th:action="@{/carrello/add/{id}(id=${prodotto.id})}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                                <input type="hidden" name="quantita" value="1">
                                <button type="submit" class="btn-add-cart" title="Aggiungi alla borsa">
                                    <i class="fas fa-shopping-bag"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </article>
        </div>

        <div th:if="${prodotti == null || prodotti.isEmpty()}" class="empty-state">
            <i class="fas fa-box-open"></i>
            <p>Nessun capo corrisponde alla tua ricerca.</p>
            <a th:href="@{/prodotti}" class="btn-line">Mostra tutta la collezione</a>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
