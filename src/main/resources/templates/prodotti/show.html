<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(title=${prodotto != null ? prodotto.nome : 'Prodotto'})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div th:if="${prodotto == null}" class="empty-state">
            <i class="fas fa-circle-question"></i>
            <p>Il capo che cerchi non esiste o è stato ritirato.</p>
            <a th:href="@{/prodotti}" class="btn-solid">Torna al catalogo</a>
        </div>

        <div th:if="${prodotto != null}">

            <div class="product-detail">

                <figure class="product-detail__media m-0">
                    <img th:src="${prodotto.urlImage != null ? prodotto.urlImage : '/images/placeholder.jpg'}"
                         th:alt="${prodotto.nome}">
                </figure>

                <div>
                    <span class="eyebrow" th:text="${prodotto.categoria != null ? prodotto.categoria.nome : 'Senza categoria'}">Categoria</span>
                    <h1 th:text="${prodotto.nome}">Nome prodotto</h1>
                    <span class="price-lg" th:text="'€' + ${prodotto.prezzo}">€19,99</span>

                    <div th:if="${prodotto.quantitaDisponibile > 0}" class="stock-ok">Disponibile &middot;
                        <span th:text="${prodotto.quantitaDisponibile} + ' pezzi'">10 pezzi</span>
                    </div>
                    <div th:unless="${prodotto.quantitaDisponibile > 0}" class="stock-no">Esaurito</div>

                    <div class="spec">
                        <h5>Descrizione</h5>
                        <p th:text="${prodotto.descrizione}">Descrizione del prodotto...</p>
                    </div>

                    <div class="spec" th:if="${!prodotto.taglieDisponibili.isEmpty()}">
                        <h5>Taglie</h5>
                        <span th:each="taglia : ${prodotto.taglieDisponibili}" class="chip" th:text="${taglia}">S</span>
                    </div>

                    <div class="spec" th:if="${!prodotto.coloriDisponibili.isEmpty()}">
                        <h5>Colori</h5>
                        <span th:each="colore : ${prodotto.coloriDisponibili}" class="chip" th:text="${colore}">Nero</span>
                    </div>

                    <!-- Acquisto -->
                    <div class="spec" sec:authorize="isAuthenticated()">
                        <form th:action="@{/carrello/add/{id}(id=${prodotto.id})}" method="post" class="row g-3 align-items-end">
                            <div class="col-auto">
                                <label class="form-label">Quantità</label>
                                <input type="number" name="quantita" value="1" min="1"
                                       th:max="${prodotto.quantitaDisponibile}" class="form-control" style="width: 96px;">
                            </div>
                            <div class="col-auto" th:if="${!prodotto.taglieDisponibili.isEmpty()}">
                                <label class="form-label">Taglia</label>
                                <select name="taglia" class="form-select">
                                    <option th:each="t : ${prodotto.taglieDisponibili}" th:value="${t}" th:text="${t}">S</option>
                                </select>
                            </div>
                            <div class="col-auto" th:if="${!prodotto.coloriDisponibili.isEmpty()}">
                                <label class="form-label">Colore</label>
                                <select name="colore" class="form-select">
                                    <option th:each="c : ${prodotto.coloriDisponibili}" th:value="${c}" th:text="${c}">Nero</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn-solid">Aggiungi alla borsa</button>
                            </div>
                        </form>
                    </div>

                    <div class="spec" sec:authorize="!isAuthenticated()">
                        <p class="form-note">
                            Per acquistare, <a th:href="@{/login}">accedi</a> o <a th:href="@{/register}">registrati</a>.
                        </p>
                    </div>

                  
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
