<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 🔹 USA IL LAYOUT BASE (come tutte le altre pagine) -->
<head th:replace="fragments/base :: head(title='Registrazione completata')"></head>

<body>

    <!-- 🔹 NAVBAR dal layout base -->
    <header th:replace="fragments/base :: navbar"></header>

    <!-- 🔹 CONTENUTO PRINCIPALE -->
    <main class="container py-4" th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow text-center">
                    <div class="card-body py-5">
                        <!-- Icona di successo -->
                        <div class="display-1 text-success mb-3">✅</div>
                        
                        <h2 class="mb-3">Registrazione completata!</h2>
                        <p class="text-muted">Il tuo account è stato creato con successo.</p>
                        <p class="text-muted">Ora puoi accedere al tuo account.</p>
                        
                        <!-- Pulsanti -->
                        <div class="d-grid gap-2 mt-4">
                            <a th:href="@{/login}" class="btn btn-primary">
                                🔐 Accedi ora
                            </a>
                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                🏠 Torna alla home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 🔹 FOOTER dal layout base -->
    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
