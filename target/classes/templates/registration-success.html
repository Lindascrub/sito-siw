<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Registrazione completata')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--tight">

        <div class="page-head page-head--center">
            <span class="eyebrow">Benvenuta</span>
            <h1>Registrazione completata</h1>
            <p>Il tuo account è stato creato con successo. Ora puoi accedere e iniziare a esplorare la collezione.</p>
        </div>

        <div class="form-actions" style="justify-content: center;">
            <a th:href="@{/login}" class="btn-solid">Accedi ora</a>
            <a th:href="@{/}" class="btn-line">Torna alla home</a>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
