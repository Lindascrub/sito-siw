<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============================================ -->
<!-- 🔹 HEAD (fragment)                          -->
<!-- ============================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'IntimiStore'">IntimiStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- ============================================ -->
    <!-- 🔹 NAVBAR (fragment)                         -->
    <!-- ============================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">👗 IntimiStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/prodotti}">Catalogo</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/ordini/storico}">I miei ordini</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}">Admin</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link position-relative" th:href="@{/carrello}">
                            🛒
                            <span class="badge bg-primary rounded-pill" 
                                  th:text="${carrello != null ? carrello.getNumeroArticoli() : 0}">0</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            👤 <span sec:authentication="name">Utente</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/logout}">🚪 Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">🔐 Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/register}">📝 Registrati</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- 🔹 CONTENUTO PRINCIPALE (fragment)           -->
    <!-- ============================================ -->
    <main class="container py-4" th:fragment="content">
        <!-- Il contenuto specifico verrà inserito qui -->
    </main>

    <!-- ============================================ -->
    <!-- 🔹 FOOTER (fragment)                         -->
    <!-- ============================================ -->
    <footer class="bg-dark text-white text-center py-3 mt-5" th:fragment="footer">
        <div class="container">
            <p class="mb-0">&copy; 2025 IntimiStore - Tutti i diritti riservati</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
