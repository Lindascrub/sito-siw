<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Area amministrativa')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Backoffice</span>
            <h1>Area amministrativa</h1>
        </div>

        <div class="grid-3">
            <div class="tile">
                <h3>Prodotti</h3>
                <p>Gestisci il catalogo</p>
                <a th:href="@{/admin/prodotti}" class="btn-solid">Vai</a>
            </div>
            <div class="tile">
                <h3>Categorie</h3>
                <p>Gestisci le categorie</p>
                <a th:href="@{/admin/categorie}" class="btn-solid">Vai</a>
            </div>
            <div class="tile">
                <h3>Ordini</h3>
                <p>Visualizza tutti gli ordini</p>
                <a th:href="@{/admin/orders}" class="btn-solid">Vai</a>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
