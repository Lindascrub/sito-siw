<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Area Amministrativa')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <h1>Area Amministrativa</h1>

        <div class="row g-4 mt-3">

            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5 class="card-title">Prodotti</h5>
                        <p class="card-text">Gestisci il catalogo prodotti</p>
                        <a th:href="@{/prodotti}" class="btn btn-primary">Vai</a>
                    </div>
                </div>
            </div>

 
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5 class="card-title">Categorie</h5>
                        <p class="card-text">Gestisci le categorie</p>
                        <a th:href="@{/categorie/admin}" class="btn btn-primary">Vai</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5 class="card-title">Ordini</h5>
                        <p class="card-text">Visualizza tutti gli ordini</p>
                        <a th:href="@{/admin/orders}" class="btn btn-primary">Vai</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ordini recenti -->
        <h3 class="mt-5">Ordini in attesa</h3>
        <div th:if="${ordiniRecent != null && !ordiniRecent.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Utente</th>
                            <th>Data</th>
                            <th>Totale</th>
                            <th>Stato</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ordine : ${ordiniRecent}">
                            <td th:text="${ordine.id}">1</td>
                            <td th:text="${ordine.utente != null ? ordine.utente.email : 'N/A'}">email@test.com</td>
                            <td th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                            <td th:text="'€' + ${ordine.totale}">€0.00</td>
                            <td><span class="badge bg-warning" th:text="${ordine.stato}">CREATO</span></td>
                            <td>
                                <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn btn-sm btn-outline-primary">📄</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p th:if="${ordiniRecent == null || ordiniRecent.isEmpty()}" class="text-muted">
            Nessun ordine in attesa.
        </p>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
