<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title=${categoria.id == null ? 'Nuova categoria' : 'Modifica categoria'})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--tight">

        <div class="page-head">
            <span class="eyebrow">Backoffice</span>
            <h1 th:text="${categoria.id == null ? 'Nuova categoria' : 'Modifica categoria'}">Nuova categoria</h1>
        </div>

        <div class="panel">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</li>
                </ul>
            </div>

            <form th:action="${categoria.id == null ? @{/categorie/admin/new} : @{/categorie/admin/edit/{id}(id=${categoria.id})}}"
                  method="post"
                  th:object="${categoria}"
                  class="form-stack">

                <div class="field">
                    <label>Nome *</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="form-error"></span>
                </div>

                <div class="field">
                    <label>Descrizione</label>
                    <textarea th:field="*{descrizione}" class="form-control" rows="4"></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="form-error"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-solid">
                        <span th:text="${categoria.id == null ? 'Crea' : 'Aggiorna'}">Crea</span>
                    </button>
                    <a th:href="@{/categorie/admin}" class="btn-line">Annulla</a>
                </div>
            </form>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
