<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='La tua borsa')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--narrow">

        <div class="page-head">
            <span class="eyebrow">Borsa</span>
            <h1>Il tuo carrello</h1>
        </div>

        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <div th:if="${carrello == null || carrello.getRighe().isEmpty()}" class="empty-state">
            <i class="fas fa-shopping-bag"></i>
            <p>La tua borsa è ancora vuota.</p>
            <a th:href="@{/prodotti}" class="btn-solid">Scopri la collezione</a>
        </div>

        <div th:if="${carrello != null && !carrello.getRighe().isEmpty()}">
            <div class="panel">
                <h2 class="panel__head">Riepilogo</h2>
				<div th:each="riga : ${carrello.getRighe()}" class="panel__row cart-row">
				    <div class="cart-row__info">
				        <a th:href="@{/prodotti/{id}(id=${riga.prodotto.id})}" 
				           th:text="${riga.prodotto.nome}">Prodotto</a>
				        <span class="cart-row__details">
				            Taglia: <span th:text="${riga.taglia}">M</span> | 
				            Colore: <span th:text="${riga.colore}">Nero</span>
				        </span>
				        <!-- Modifica taglia/colore -->
				        <form th:action="@{/carrello/update-details/{id}(id=${riga.prodotto.id})}" method="post">
				            <select name="taglia" class="form-select form-select-sm">
				                <option th:each="t : ${riga.prodotto.taglieDisponibili}" 
				                        th:value="${t}" th:text="${t}"
				                        th:selected="${t == riga.taglia}"></option>
				            </select>
				            <select name="colore" class="form-select form-select-sm">
				                <option th:each="c : ${riga.prodotto.coloriDisponibili}" 
				                        th:value="${c}" th:text="${c}"
				                        th:selected="${c == riga.colore}"></option>
				            </select>
				            <button type="submit" class="btn-line btn-sm">Aggiorna</button>
				        </form>
				    </div>
				    <form th:action="@{/carrello/update/{id}(id=${riga.prodotto.id})}" method="post" class="cart-row__qty">
				        <input type="number" name="quantita" th:value="${riga.quantita}" min="1"
				               th:max="${riga.prodotto.quantitaDisponibile}" class="form-control form-control-sm">
				        <button type="submit" class="btn-line btn-sm">Aggiorna</button>
				    </form>
				    <span class="cart-row__subtotale" th:text="'€' + ${riga.getSubtotale()}">€39,98</span>
				    <form th:action="@{/carrello/remove/{id}(id=${riga.prodotto.id})}" method="post" class="cart-row__remove">
				        <button type="submit" class="btn-line btn-sm" title="Rimuovi"><i class="fas fa-trash"></i></button>
				    </form>
				</div>
                <div class="panel__row panel__row--total">
                    <span>Totale</span>
                    <span th:text="'€' + ${carrello.getTotale()}">€0,00</span>
                </div>
            </div>

            <div class="form-actions" style="margin-top: 32px;">
                <a th:href="@{/ordini/checkout}" class="btn-solid">Procedi al checkout</a>
                <a th:href="@{/prodotti}" class="btn-line">Continua lo shopping</a>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
