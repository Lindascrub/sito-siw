<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title=${prodotto.id == null ? 'Nuovo Prodotto' : 'Modifica Prodotto'})"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${prodotto.id == null ? '➕ Nuovo Prodotto' : '✏️ Modifica Prodotto'}">Nuovo Prodotto</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Messaggi di errore globali -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</li>
                            </ul>
                        </div>

                        <form th:action="${prodotto.id == null ? @{/prodotti/admin/new} : @{/prodotti/admin/edit/{id}(id=${prodotto.id})}}" 
                              method="post" 
                              th:object="${prodotto}">

                            <!-- NOME -->
                            <div class="mb-3">
                                <label class="form-label">Nome *</label>
                                <input type="text" th:field="*{nome}" class="form-control" required>
                                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger small"></span>
                            </div>

                            <!-- DESCRIZIONE -->
                            <div class="mb-3">
                                <label class="form-label">Descrizione</label>
                                <textarea th:field="*{descrizione}" class="form-control" rows="4"></textarea>
                                <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="text-danger small"></span>
                            </div>

                            <!-- PREZZO -->
                            <div class="mb-3">
                                <label class="form-label">Prezzo (€) *</label>
                                <input type="number" th:field="*{prezzo}" class="form-control" step="0.01" min="0" required>
                                <span th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}" class="text-danger small"></span>
                            </div>

                            <!-- QUANTITÀ -->
                            <div class="mb-3">
                                <label class="form-label">Quantità disponibile *</label>
                                <input type="number" th:field="*{quantitaDisponibile}" class="form-control" min="0" required>
                                <span th:if="${#fields.hasErrors('quantitaDisponibile')}" th:errors="*{quantitaDisponibile}" class="text-danger small"></span>
                            </div>

                            <!-- URL IMMAGINE -->
                            <div class="mb-3">
                                <label class="form-label">URL Immagine</label>
                                <input type="url" th:field="*{urlImage}" class="form-control" placeholder="https://esempio.com/immagine.jpg">
                                <span th:if="${#fields.hasErrors('urlImage')}" th:errors="*{urlImage}" class="text-danger small"></span>
                            </div>

                            <!-- CODICE MODELLO -->
                            <div class="mb-3">
                                <label class="form-label">Codice Modello</label>
                                <input type="text" th:field="*{codiceModello}" class="form-control" placeholder="INT-001">
                                <span th:if="${#fields.hasErrors('codiceModello')}" th:errors="*{codiceModello}" class="text-danger small"></span>
                            </div>

                            <!-- CATEGORIA -->
                            <div class="mb-3">
                                <label class="form-label">Categoria *</label>
                                <select th:field="*{categoria}" class="form-select" required>
                                    <option value="">Seleziona una categoria</option>
                                    <option th:each="cat : ${categorie}" 
                                            th:value="${cat}" 
                                            th:text="${cat.nome}"
                                            th:selected="${prodotto.categoria != null && prodotto.categoria.id == cat.id}">
                                    </option>
                                </select>
                                <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" class="text-danger small"></span>
                            </div>

                            <!-- TAGLIE -->
                            <div class="mb-3">
                                <label class="form-label">Taglie disponibili</label>
                                <select th:field="*{taglieDisponibili}" class="form-select" multiple>
                                    <option th:each="taglia : ${taglie}" 
                                            th:value="${taglia.nome}" 
                                            th:text="${taglia.nome} + ' (' + ${taglia.descrizione} + ')'">
                                    </option>
                                </select>
                                <small class="text-muted">Tieni premuto Ctrl/Cmd per selezionare più taglie</small>
                            </div>

                            <!-- COLORI -->
                            <div class="mb-3">
                                <label class="form-label">Colori disponibili</label>
                                <input type="text" th:field="*{coloriDisponibili}" class="form-control" 
                                       placeholder="Inserisci i colori separati da virgola (es. Nero, Blu, Rosso)">
                                <small class="text-muted">Separa i colori con una virgola</small>
                            </div>

                            <!-- ATTIVO -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" th:field="*{attivo}" class="form-check-input" id="attivo">
                                <label class="form-check-label" for="attivo">Prodotto attivo</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    💾 <span th:text="${prodotto.id == null ? 'Crea' : 'Aggiorna'}">Crea</span>
                                </button>
                                <a th:href="@{/prodotti}" class="btn btn-secondary">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
