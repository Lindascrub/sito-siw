<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalogo - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <!-- HEADER IMPORTATO -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- CONTENUTO -->
    <main>
        <div class="catalogo-header">
            <h2>I nostri prodotti</h2>
            
            <!-- 🔍 BARRA DI RICERCA -->
            <form th:action="@{/prodotti/ricerca}" method="GET" class="search-form">
                <input type="text" 
                       name="q" 
                       placeholder="Cerca prodotto..." 
                       th:value="${query}"
                       class="search-input"/>
                <button type="submit" class="search-btn">🔍</button>
                <a th:href="@{/prodotti}" th:if="${query != null}" class="search-clear">✕</a>
            </form>
        </div>

        <!-- Risultati -->
        <p th:if="${query != null}" class="search-results">
            Risultati per: "<span th:text="${query}"></span>"
            <span th:text="'(' + ${prodotti.size()} + ' prodotti)'"></span>
        </p>

        <div class="prodotti-grid">
            <div class="prodotto-card" th:each="p : ${prodotti}">
                <img th:src="${p.urlImmagine}" th:alt="${p.nome}" th:if="${p.urlImmagine != null}"/>
                <img src="/images/no-image.png" th:unless="${p.urlImmagine != null}" alt="Immagine non disponibile"/>
                <h3 th:text="${p.nome}">Nome Prodotto</h3>
                <p class="categoria" th:text="'Categoria: ' + ${p.categoria.nome}">Categoria</p>
                <p class="prezzo" th:text="'€ ' + ${p.prezzo}">€ 0.00</p>
                <p class="quantita" th:text="'Disponibili: ' + ${p.quantitaDisponibile}">Disponibili: 0</p>
                <div th:if="${!p.taglie.isEmpty()}">
                    <span class="taglia-badge" th:each="t : ${p.taglie}" th:text="${t.codice}"></span>
                </div>
                <a th:href="@{/prodotto/} + ${p.id}" class="btn-dettaglio">Vedi Dettaglio</a>
            </div>
            <p th:if="${prodotti.isEmpty()}" class="nessun-prodotto">
                <span th:if="${query != null}">Nessun prodotto trovato per "<span th:text="${query}"></span>"</span>
                <span th:unless="${query != null}">Nessun prodotto disponibile al momento.</span>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
