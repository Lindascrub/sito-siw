<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${prodotto.nome} + ' - IntimoStore'">Prodotto - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <!-- HEADER IMPORTATO -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- CONTENUTO -->
    <main>
        <div class="dettaglio-prodotto">
            <div class="immagine">
                <img th:src="${prodotto.urlImmagine}" th:alt="${prodotto.nome}" th:if="${prodotto.urlImmagine != null}"/>
                <img src="/images/no-image.png" th:unless="${prodotto.urlImmagine != null}" alt="Immagine non disponibile"/>
            </div>
            <div class="info">
                <h2 th:text="${prodotto.nome}">Nome Prodotto</h2>
                <p class="categoria" th:text="'Categoria: ' + ${prodotto.categoria.nome}">Categoria</p>
                <p class="descrizione" th:text="${prodotto.descrizione}">Descrizione</p>
                <p class="prezzo" th:text="'€ ' + ${prodotto.prezzo}">€ 0.00</p>
                <p class="quantita" th:text="'Disponibili: ' + ${prodotto.quantitaDisponibile}">Disponibili: 0</p>
                <div class="taglie" th:if="${!prodotto.taglie.isEmpty()}">
                    <h4>Taglie disponibili:</h4>
                    <span th:each="t : ${prodotto.taglie}" th:text="${t.codice}" class="taglia-badge"></span>
                </div>
                
                <!-- 🔥 FORM AGGIUNGI AL CARRELLO 🔥 -->
                <div class="aggiungi-carrello">
                    <form th:action="@{/carrello/aggiungi/} + ${prodotto.id}" method="POST">
                        <label>Quantità:</label>
                        <input type="number" name="quantita" value="1" min="1" max="${prodotto.quantitaDisponibile}"/>
                        <button type="submit" class="btn-primary">🛒 Aggiungi al carrello</button>
                    </form>
                </div>
                
                <a th:href="@{/prodotti}" class="btn-secondary">Torna al catalogo</a>
            </div>
        </div>
        
        <!-- SEZIONE RECENSIONI (solo se funziona, altrimenti commentala) -->
        <div class="recensioni-section">
            <h3>Recensioni</h3>
            
            <!-- Form per aggiungere recensione (solo se loggato) -->
            <div th:if="${utenteCorrente != null}" class="recensione-form">
                <h4>Lascia una recensione</h4>
                <form th:action="@{/recensione/aggiungi}" method="POST">
                    <input type="hidden" name="prodottoId" th:value="${prodotto.id}"/>
                    <div class="form-group">
                        <label>Titolo</label>
                        <input type="text" name="titolo" required/>
                    </div>
                    <div class="form-group">
                        <label>Valutazione</label>
                        <select name="valutazione" required>
                            <option value="5">⭐⭐⭐⭐⭐</option>
                            <option value="4">⭐⭐⭐⭐</option>
                            <option value="3">⭐⭐⭐</option>
                            <option value="2">⭐⭐</option>
                            <option value="1">⭐</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Testo</label>
                        <textarea name="testo" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Invia recensione</button>
                </form>
            </div>
            
            <!-- Lista recensioni -->
            <div class="recensioni-list">
                <div th:each="r : ${recensioni}" class="recensione-card">
                    <div class="recensione-header">
                        <span class="recensione-utente" th:text="${r.utente.nome}">Utente</span>
                        <span class="recensione-voto" th:text="${#strings.repeat('⭐', r.valutazione)}">⭐⭐⭐⭐⭐</span>
                        <span class="recensione-data" th:text="${#temporals.format(r.dataCreazione, 'dd/MM/yyyy')}">01/01/2024</span>
                    </div>
                    <h4 th:text="${r.titolo}">Titolo</h4>
                    <p th:text="${r.testo}">Testo recensione</p>
                </div>
                <p th:if="${recensioni.isEmpty()}" class="nessuna-recensione">
                    Nessuna recensione per questo prodotto.
                </p>
            </div>
        </div>
    </main>

	<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
