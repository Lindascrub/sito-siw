<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrazione - IntimoStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <!-- HEADER DIRETTAMENTE NEL FILE -->
    <header>
        <div class="header-container">
            <div class="logo">
                <a th:href="@{/}">
                    <h1>IntimoStore</h1>
                </a>
            </div>
            
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/categorie}">Categorie</a>
                <a th:href="@{/prodotti}">Catalogo</a>
                <a th:href="@{/carrello}">🛒 Carrello</a>
                <a th:href="@{/ordini}">📦 Ordini</a>
            </nav>
            
            <div class="auth-buttons">
                <div class="auth-links">
                    <a th:href="@{/login}" class="btn-login">Accedi</a>
                    <a th:href="@{/register}" class="btn-register">Registrati</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h2>Registrati</h2>
            
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            
            <form th:action="@{/register}" method="POST" class="auth-form">
                <h3>Dati personali</h3>
                
                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" name="nome" required/>
                </div>
                
                <div class="form-group">
                    <label>Cognome *</label>
                    <input type="text" name="cognome" required/>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required/>
                </div>
                
                <h3>Credenziali</h3>
                
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" name="username" required/>
                </div>
                
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" required/>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Registrati</button>
                </div>
            </form>
            
            <p class="auth-link">
                Hai già un account? <a th:href="@{/login}">Accedi</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IntimoStore - Progetto SIW</p>
    </footer>
</body>
</html>
