<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Lunna</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>Lunna</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/categorie}">Categorie</a>
            <a th:href="@{/prodotti}">Catalogo</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Accedi</h2>
            
            <div th:if="${param.error}" class="error-message">
                Username o password non validi
            </div>
            
            <form th:action="@{/login}" method="POST" class="auth-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required/>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required/>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Accedi</button>
                </div>
            </form>
            
            <p class="auth-link">
                Non hai un account? <a th:href="@{/register}">Registrati</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; Progetto SIW</p>
    </footer>
</body>
</html>
