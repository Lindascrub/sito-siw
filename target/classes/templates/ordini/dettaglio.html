<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Dettaglio ordine')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <a th:href="@{/ordini/history}" class="btn btn-outline-secondary btn-sm mb-3">← Torna ai tuoi ordini</a>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Ordine #<span th:text="${ordine.id}">123</span></h1>
            <span class="badge fs-6"
                  th:class="${ordine.stato.name() == 'CREATO'} ? 'badge bg-warning' :
                            ${ordine.stato.name() == 'PAGATO'} ? 'badge bg-info' :
                            ${ordine.stato.name() == 'SPEDITO'} ? 'badge bg-primary' :
                            ${ordine.stato.name() == 'CONSEGNATO'} ? 'badge bg-success' : 'badge bg-danger'"
                  th:text="${ordine.stato}">CREATO</span>
        </div>

        <p class="text-muted" th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</p>

        <div class="row g-4">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Articoli</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th>Prodotto</th>
                                    <th>Taglia</th>
                                    <th>Colore</th>
                                    <th>Qtà</th>
                                    <th class="text-end">Subtotale</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="riga : ${ordine.righe}">
                                    <td th:text="${riga.prodotto.nome}">Prodotto</td>
                                    <td th:text="${riga.taglia}">M</td>
                                    <td th:text="${riga.colore}">Nero</td>
                                    <td th:text="${riga.quantita}">1</td>
                                    <td class="text-end" th:text="'€' + ${riga.getSubtotale()}">€0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="fw-bold">
                                    <td colspan="4" class="text-end">Totale</td>
                                    <td class="text-end" th:text="'€' + ${ordine.totale}">€0.00</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Spedizione</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-1" th:text="${ordine.indirizzoSpedizione}">Via Roma, 123</p>
                        <p th:text="${ordine.cittaSpedizione} + ' - ' + ${ordine.codPostaleSpedizione}">Roma - 00100</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
