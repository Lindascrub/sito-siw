<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Ordine confermato')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--narrow">

        <div class="page-head page-head--center">
            <span class="eyebrow">Grazie</span>
            <h1>Ordine confermato</h1>
            <p>Il tuo ordine è stato registrato. Ti scriveremo appena il pacco lascia il nostro atelier.</p>
        </div>

        <div class="panel">
            <h2 class="panel__head">Ordine #<span th:text="${ordine.id}">123</span></h2>
            <div class="panel__row">
                <span>Stato</span>
                <span class="stato" th:text="${ordine.stato}">CREATO</span>
            </div>
            <div class="panel__row">
                <span>Spedizione</span>
                <span>
                    <span th:text="${ordine.indirizzoSpedizione}">Via Roma, 123</span><br>
                    <span th:text="${ordine.cittaSpedizione} + ' — ' + ${ordine.codPostaleSpedizione}">Roma — 00100</span>
                </span>
            </div>
            <div class="panel__row panel__row--total">
                <span>Totale</span>
                <span th:text="'€' + ${ordine.totale}">€0,00</span>
            </div>
        </div>

        <div class="form-actions" style="margin-top: 32px; justify-content: center;">
            <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn-line">Vedi dettaglio</a>
            <a th:href="@{/prodotti}" class="btn-solid">Continua lo shopping</a>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
