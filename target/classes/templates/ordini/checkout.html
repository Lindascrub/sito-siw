<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Checkout')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Ultimo passo</span>
            <h1>Checkout</h1>
        </div>

        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <div class="split">

            <!-- Dati di spedizione -->
            <div class="panel">
                <h2 class="panel__head">Dati di spedizione</h2>
                <form th:action="@{/ordini/checkout}" method="post" class="form-stack">
                    <div class="field">
                        <label>Indirizzo *</label>
                        <input type="text" name="indirizzo" class="form-control" required
                               th:value="${ultimoIndirizzo}" placeholder="Via Roma, 123">
                    </div>
                    <div class="field">
                        <label>Città *</label>
                        <input type="text" name="citta" class="form-control" required
                               th:value="${ultimaCitta}" placeholder="Roma">
                    </div>
                    <div class="field">
                        <label>CAP *</label>
                        <input type="text" name="cap" class="form-control" required
                               th:value="${ultimoCap}" placeholder="00100">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-solid">Conferma ordine</button>
                        <a th:href="@{/carrello}" class="btn-line">Torna alla borsa</a>
                    </div>
                </form>
            </div>

            <!-- Riepilogo -->
            <div class="panel">
                <h2 class="panel__head">Riepilogo ordine</h2>
                <div th:each="riga : ${carrello.getRighe()}" class="panel__row">
                    <span th:text="${riga.prodotto.nome} + ' × ' + ${riga.quantita}">Prodotto × 2</span>
                    <span th:text="'€' + ${riga.getSubtotale()}">€39,98</span>
                </div>
                <div class="panel__row panel__row--total">
                    <span>Totale</span>
                    <span th:text="'€' + ${carrello.getTotale()}">€0,00</span>
                </div>
            </div>

        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
