<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='I miei ordini')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Account</span>
            <h1>I tuoi ordini</h1>
        </div>

        <div th:if="${ordini == null || ordini.isEmpty()}" class="empty-state">
            <i class="fas fa-receipt"></i>
            <p>Non hai ancora effettuato ordini.</p>
            <a th:href="@{/prodotti}" class="btn-solid">Inizia a fare shopping</a>
        </div>

        <div th:if="${ordini != null && !ordini.isEmpty()}" class="grid-2">
            <article class="order-card" th:each="ordine : ${ordini}">
                <div class="d-flex justify-content-between align-items-start">
                    <span class="order-card__id">Ordine #<span th:text="${ordine.id}">123</span></span>
                    <span class="stato"
                          th:classappend="${ordine.stato.name() == 'CONSEGNATO'} ? ' stato--ok' :
                                          (${ordine.stato.name() == 'ANNULLATO'} ? ' stato--ko' : '')"
                          th:text="${ordine.stato}">CREATO</span>
                </div>
                <span class="order-card__meta" th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</span>
                <span class="order-card__total" th:text="'€' + ${ordine.totale}">€0,00</span>
                <div>
                    <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn-line">Dettaglio</a>
                </div>
            </article>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
