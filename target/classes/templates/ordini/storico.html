<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='I miei ordini')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <h1>📋 I tuoi ordini</h1>

        <div th:if="${ordini == null || ordini.isEmpty()}">
            <div class="text-center py-5">
                <p class="text-muted">Non hai ancora effettuato ordini.</p>
                <a th:href="@{/prodotti}" class="btn btn-primary">🛍️ Inizia a fare shopping</a>
            </div>
        </div>

        <div th:if="${ordini != null && !ordini.isEmpty()}">
            <div class="row g-3">
                <div class="col-md-6" th:each="ordine : ${ordini}">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5 class="card-title">Ordine #<span th:text="${ordine.id}">123</span></h5>
                                <span class="badge" 
                                      th:class="${ordine.stato.name() == 'CREATO'} ? 'bg-warning' :
                                                ${ordine.stato.name() == 'PAGATO'} ? 'bg-info' :
                                                ${ordine.stato.name() == 'SPEDITO'} ? 'bg-primary' :
                                                ${ordine.stato.name() == 'CONSEGNATO'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${ordine.stato}">
                                    CREATO
                                </span>
                            </div>
                            <p class="text-muted small" th:text="${#temporals.format(ordine.dataOrdine, 'dd/MM/yyyy HH:mm')}">01/01/2025</p>
                            <p><strong th:text="'€' + ${ordine.totale}">€0.00</strong></p>
                            <a th:href="@{/ordini/{id}(id=${ordine.id})}" class="btn btn-outline-primary btn-sm">📄 Dettaglio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
