<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/base :: head(title='Errore del server')"></head>
<body>

    <header th:replace="fragments/base :: navbar"></header>

    <main class="container py-4" th:fragment="content">
        <div class="text-center py-5">
            <div class="display-1 text-danger">500</div>
            <h1 class="display-6">⚠️ Errore del server</h1>
            <p class="text-muted" th:text="${errorMessage} ?: 'Si è verificato un errore interno. Riprova più tardi.'">
                Si è verificato un errore interno. Riprova più tardi.
            </p>
            <a th:href="@{/}" class="btn btn-primary">🏠 Torna alla home</a>
        </div>
    </main>

    <footer th:replace="fragments/base :: footer"></footer>

</body>
</html>
