<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Pagina non trovata')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <main class="error-page">
        <div class="code">404</div>
        <h1>Pagina non trovata</h1>
        <p th:text="${errorMessage} ?: 'La pagina che stai cercando non esiste o è stata spostata.'">
            La pagina che stai cercando non esiste o è stata spostata.
        </p>
        <a th:href="@{/}" class="btn-solid">Torna alla home</a>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
