<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='I miei preferiti')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page">

        <div class="page-head">
            <span class="eyebrow">Account</span>
            <h1>I miei preferiti</h1>
        </div>

        <div th:if="${preferiti == null || preferiti.isEmpty()}" class="empty-state">
            <i class="fas fa-heart"></i>
            <p>Non hai ancora salvato nessun capo.</p>
            <a th:href="@{/prodotti}" class="btn-solid">Vai al catalogo</a>
        </div>

        <div th:if="${preferiti != null && !preferiti.isEmpty()}" class="product-grid">
            <article class="product-card" th:each="prodotto : ${preferiti}">
                <a th:href="@{/prodotti/{id}(id=${prodotto.id})}">
                    <img th:src="${prodotto.urlImage != null ? prodotto.urlImage : '/images/placeholder.jpg'}"
                         th:alt="${prodotto.nome}">
                </a>
                <div class="card-body">
                    <h5 class="card-title"><a th:href="@{/prodotti/{id}(id=${prodotto.id})}" th:text="${prodotto.nome}">Nome</a></h5>
                    <span class="price" th:text="'€' + ${prodotto.prezzo}">€19,99</span>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="category-badge" th:text="${prodotto.categoria != null ? prodotto.categoria.nome : 'Generico'}">Categoria</span>
                        <form th:action="@{/preferiti/toggle/{id}(id=${prodotto.id})}" method="post" class="d-inline">
                            <input type="hidden" name="redirect" th:value="@{/preferiti}">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Rimuovi dai preferiti">
                                <i class="fas fa-heart"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
