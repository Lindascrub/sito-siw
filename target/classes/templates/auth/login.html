<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Login')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <main class="container py-4" th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white"><h4>🔐 Login</h4></div>
                    <div class="card-body">
                        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}"></div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required></div>
                            <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                        </form>
                        <hr>
                        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100">🔴 Google</a>
                        <p class="mt-3"><a th:href="@{/register}">Registrati</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
