<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Accedi')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: nav-menu}"></div>

    <main class="page page--tight">

        <div class="page-head page-head--center">
            <span class="eyebrow">Area riservata</span>
            <h1>Accedi</h1>
        </div>

        <div class="panel">
            <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

            <form th:action="@{/login}" method="post" class="form-stack">
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-solid w-100">Accedi</button>
            </form>

            <div class="panel__row" style="margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 0; padding-top: 24px;">
                <a th:href="@{/oauth2/authorization/google}" class="btn-line w-100">
                    <i class="fab fa-google"></i> Continua con Google
                </a>
            </div>

            <p class="form-note text-center mb-0">
                Non hai un account? <a th:href="@{/register}">Registrati</a>
            </p>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
