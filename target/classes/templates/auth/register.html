<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Registrati')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>

    <main th:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card bg-dark text-white border-secondary">
                        <div class="card-header border-secondary text-center">
                            <h4>Registrati</h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>
                            <form th:action="@{/register}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Nome</label>
                                    <input type="text" name="nome" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Cognome</label>
                                    <input type="text" name="cognome" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Conferma Password</label>
                                    <input type="password" name="confirmPassword" class="form-control bg-dark text-white border-secondary" required>
                                </div>
                                <button type="submit" class="btn btn-light text-dark w-100">Registrati</button>
                            </form>
                            <p class="text-center mt-3">
                                <a th:href="@{/login}" class="text-white-50">Hai già un account?</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
